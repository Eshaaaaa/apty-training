<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Gallery Flip Cards</title>
    <link rel="stylesheet" href="./styles/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="gallery">
      <figure class="movie-card" tabindex="0">
        <div class="movie-card-inner">
          <div class="movie-card-front">
            <img src="./media/inception.jfif" alt="Inception Poster" />
          </div>
          <figcaption class="movie-card-back">
            <h2>Inception</h2>
            <p><strong>Genre:</strong> Sci-Fi, Thriller</p>
            <p>
              <strong>Rating:</strong>
              <span aria-hidden="true">★★★★☆</span> (8.8/10)
            </p>
            <p>
              A mind-bending thriller where dreams can be invaded. Directed by
              Nolan.
            </p>
          </figcaption>
        </div>
      </figure>

      <figure class="movie-card" tabindex="0">
        <div class="movie-card-inner">
          <div class="movie-card-front">
            <img src="./media/interstellar.jpg" alt="Interstellar Poster" />
          </div>
          <figcaption class="movie-card-back">
            <h2>Interstellar</h2>
            <p><strong>Genre:</strong> Sci-Fi, Drama</p>
            <p>
              <strong>Rating:</strong>
              <span aria-hidden="true">★★★★★</span> (9.0/10)
            </p>
            <p>A powerful journey through space and time to save humanity.</p>
          </figcaption>
        </div>
      </figure>

      <figure class="movie-card" tabindex="0">
        <div class="movie-card-inner">
          <div class="movie-card-front">
            <img src="./media/joker.jpg" alt="Joker Poster" />
          </div>
          <figcaption class="movie-card-back">
            <h2>Joker</h2>
            <p><strong>Genre:</strong> Drama, Crime</p>
            <p>
              <strong>Rating:</strong>
              <span aria-hidden="true">★★★★☆</span> (8.4/10)
            </p>
            <p>
              An origin story of Gotham's most infamous villain, brilliantly
              portrayed.
            </p>
          </figcaption>
        </div>
      </figure>
    </div>
  </body>
</html>
