<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TasteBud Café</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .container {
        background-color: #fff8f0;
        padding: 20px;
        max-width: 600px;
        margin: 40px auto;
        border-radius: 10px;
        font-family: "Segoe UI", sans-serif;
      }

      p {
        font-size: 18px;
        margin-bottom: 15px;
      }

      img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 id="main-heading">TasteBud Café</h1>

      <p>
        Welcome to TasteBud Café, your cozy corner for handcrafted coffees and
        delicious bites made with love.
      </p>

      <ul>
        <li style="color: rgb(36, 36, 155)">Signature Latte – ₹150</li>
        <li>Cheesy Garlic Bread – ₹120</li>
        <li>Classic Pancakes – ₹180</li>
      </ul>

      <img
        src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092"
        alt="Delicious food at TasteBud Café"
      />
    </div>
  </body>
</html>
