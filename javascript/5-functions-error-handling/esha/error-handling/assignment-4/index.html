<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Custom Error Calculator</title>
  </head>
  <body>
    <h2>Simple Calculator with Error Handling</h2>

    <label for="val1">First Number:</label>
    <input type="text" id="val1" /><br /><br />

    <label for="val2">Second Number:</label>
    <input type="text" id="val2" /><br /><br />

    <label for="op">Operator (+, -, *, /, %):</label>
    <input type="text" id="op" /><br /><br />

    <button onclick="runCalculation()">Compute</button>

    <h3>Output:</h3>
    <p id="result"></p>

    <script src="./scripts/script.js"></script>
  </body>
</html>
