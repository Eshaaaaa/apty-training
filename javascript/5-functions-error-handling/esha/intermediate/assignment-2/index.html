<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Higher-Order Function: Filter Array</title>
  </head>
  <body>
    <h2>Filter Numbers</h2>

    <label>Comma-separated numbers:</label><br />
    <input
      type="text"
      id="numberInput"
      placeholder="e.g., 5,12,8,20"
    /><br /><br />

    <label>Max value allowed:</label><br />
    <input type="number" id="limitInput" placeholder="e.g., 10" /><br /><br />

    <button onclick="filterNumbers()">Filter</button>

    <p id="result"></p>

    <script src="./scripts/script.js"></script>
  </body>
</html>
