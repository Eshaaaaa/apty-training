<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lexical Scoping Meal Example</title>
  </head>
  <body>
    <h2>Build Your Meal</h2>

    <label
      >Main Dish:
      <input type="text" id="dish" placeholder="e.g. Pasta" /></label
    ><br /><br />
    <label
      >Drink:
      <input type="text" id="drink" placeholder="e.g. Lemonade" /></label
    ><br /><br />
    <label
      >Dessert:
      <input type="text" id="dessert" placeholder="e.g. Brownie" /></label
    ><br /><br />
    <button onclick="showMeal()">Show My Meal</button>

    <p id="output"></p>

    <script src="./scripts/script.js"></script>
