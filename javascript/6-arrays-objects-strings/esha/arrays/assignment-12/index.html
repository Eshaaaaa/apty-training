<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remove Duplicates from Array</title>
  </head>
  <body>
    <h1>Remove Duplicates</h1>

    <label for="arrayInput">Enter array elements (comma-separated):</label>
    <input type="text" id="arrayInput" placeholder="1,3,2,2,3,4,4,3" />
    <button onclick="removeDuplicates()">Remove Duplicates</button>

    <p>Unique Array: <span id="result"></span></p>

    <script src="./scripts/script.js"></script>
  </body>
