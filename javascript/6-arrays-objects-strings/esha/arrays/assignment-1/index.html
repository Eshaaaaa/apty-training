<!DOCTYPE html>
<html>
  <head>
    <title>Custom Flatten Function</title>
  </head>
  <body>
    <h3>Flatten Nested Array</h3>
    <p>Enter array (e.g., [1, 2, [3, 4], [5, [6, 7]]])</p>
    <input type="text" id="arrayInput" placeholder="Enter nested array" />
    <button onclick="flattenInput()">Flatten</button>

    <p><strong>Output:</strong></p>
    <pre id="output"></pre>

    <script src="./scripts/script.js"></script>
  </body>
</html>
