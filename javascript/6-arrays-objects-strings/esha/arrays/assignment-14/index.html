<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Destructuring</title>
  </head>
  <body>
    <h1>Swap Two Variables Using Array Destructuring</h1>

    <label for="aInput">Enter value for a:</label>
    <input type="number" id="aInput" />

    <br /><br />

    <label for="bInput">Enter value for b:</label>
    <input type="number" id="bInput" />

    <br /><br />

    <button onclick="swapVariables()">Swap</button>

    <p>
      After Swap: a = <span id="aResult"></span>, b = <span id="bResult"></span>
    </p>

    <script src="./scripts/script.js"></script>
  </body>
</html>
