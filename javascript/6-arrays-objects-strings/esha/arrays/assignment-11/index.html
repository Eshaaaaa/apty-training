<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Chunking</title>
  </head>
  <body>
    <h1>Chunk Array Function</h1>

    <label for="arrayInput">Enter array elements (comma-separated):</label>
    <input type="text" id="arrayInput" placeholder="1,2,3,4,5" />

    <br /><br />

    <label for="chunkInput">Enter chunk size:</label>
    <input type="number" id="chunkInput" placeholder="2" />

    <br /><br />

    <button onclick="chunkArray()">Chunk Array</button>

    <p>Chunked Array:</p>
    <pre id="chunkedArray"></pre>

    <script src="./scripts/script.js"></script>
  </body>
</html>
