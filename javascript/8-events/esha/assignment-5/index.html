<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Bubbling Demo</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #e6e6fa; 
      }
      .outer-container {
        width: 300px;
        height: 300px;
        background-color: #add8e6;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: 2px solid #4682b4; 
        color: #4682b4;
        font-size: 1.2em;
        font-weight: bold;
      }
      .inner-box {
        border: 3px solid #4682b4;
        width: 150px;
        height: 150px;
        background-color: #90ee90; 
        display: flex;
        justify-content: center;
        align-items: center;
        color: #006400; 
        font-size: 1em;
      }
    </style>
  </head>
  <body>
    <div class="outer-container" id="parentDiv">
      Outer Container
      <div class="inner-box" id="childDiv">Inner Box</div>
    </div>
    <script src="./scripts/script.js"></script>
  </body>
</html>
