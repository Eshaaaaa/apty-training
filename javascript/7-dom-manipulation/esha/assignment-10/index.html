<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Table Rows in Shadow DOM</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #shadow-host {
            width: 80%;
            height: 600px;
            border: 1px solid black;
            padding: 10px;
            box-sizing: border-box;
        }
        button {
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>Moving Table Rows in Shadow DOM</h1>
    <div id="shadow-host"></div>
    <div>
        <button id="moveUpBtn">Move Up</button>
        <button id="moveDownBtn">Move Down</button>
        <button id="moveTopBtn">Move Top</button>
        <button id="moveBottomBtn">Move Bottom</button>
    </div>

    <script src="./scripts/script.js"></script>

</body>
</html>
