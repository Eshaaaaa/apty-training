<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies</title>
</head>
<body>
    <h1>Cookie Manager</h1>
    
    <section>
        <h2>Set a Cookie</h2>
        <input type="text" id="cookieNameInput" placeholder="Name">
        <input type="text" id="cookieValueInput" placeholder="Value">
        <button id="setCookieBtn">Set</button>
    </section>

    <section>
        <h2>Get a Cookie</h2>
        <input type="text" id="getCookieInput" placeholder="Name">
        <button id="getCookieBtn">Get</button>
        <p id="cookieOutput"></p>
    </section>

    <section>
        <h2>Delete a Cookie</h2>
        <input type="text" id="deleteCookieInput" placeholder="Name">
        <button id="deleteCookieBtn">Delete</button>
    </section>

    <script src="./scripts/script.js"></script>
</body>
</html>
