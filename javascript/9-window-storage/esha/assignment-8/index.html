<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Assignment</title>
</head>
<body>
    <h1>Storage Assignment</h1>
    <h3>Local Storage</h3>
    <input type="text" id="localInput" placeholder="Enter something for LocalStorage">
    <button id="saveLocalBtn">Save</button>
    <p><strong>LocalStorage Data: </strong> <span id="localData"></span></p>
    
    <h3>Session Storage</h3>
    <input type="text" id="sessionInput" placeholder="Enter something for SessionStorage">
    <button id="saveSessionBtn">Save</button>
    <p><strong>Session Storage Data: </strong> <span id="sessionData"></span></p>

    <script src="./scripts/script.js"></script>
</body>
</html>
