<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Timers</title>
</head>
<body>
    <h1>Timers</h1>

    <h2>Countdown</h2>
    <input type="number" id="countdownInput" placeholder="Enter seconds">
    <button id="startCountdownBtn">Start</button>
    <div id="countdownDisplay">Time Remaining: 0</div>

    <h2>Stopwatch</h2>
    <button id="startStopwatchBtn">Start</button>
    <button id="stopStopwatchBtn">Stop</button>
    <button id="resetStopwatchBtn">Reset</button>
    <div id="stopwatchDisplay">Elapsed Time: 0</div>

    <script src="./scripts/script.js"></script>
</body>
</html>
