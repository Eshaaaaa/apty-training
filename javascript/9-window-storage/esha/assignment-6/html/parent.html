<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Window</title>
  </head>
  <body>
    <h1>Parent Window</h1>
    <input type="text" id="parentMsg" placeholder="Message for iframe" />
    <button id="sendToChild">Send to Iframe</button>
    <p>Message from Iframe: <span id="fromChild"></span></p>
    <iframe
      id="childFrame"
      src="./iframe.html"
      style="border: 1px solid; width: 100%; height: 200px"
    ></iframe>

    <script src="../scripts/parent.js"></script>
  </body>
</html>
